name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  API_FOOTBALL_AUTOMATION_ENABLED: 'false'

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks binary
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan complete reachable history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all"'

  verify:
    name: Build, integration and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@10.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chrome
      - name: Create isolated local configuration and database
        run: pnpm local:setup
      - name: Seed the synthetic public rehearsal
        run: pnpm db:seed
      - name: Replay the competition required by browser acceptance
        run: pnpm demo:replay
      - name: Strict checks, disposable integrations, smoke and authenticated E2E
        run: pnpm verify:local
      - name: Remove disposable database
        if: always()
        run: |
          if [ -f .env.local ]; then
            docker compose --env-file .env.local -f infrastructure/local.compose.yml down --volumes
          fi

  containers:
    name: Container runtime proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@10.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm container:build
      - run: pnpm test:containers

  required:
    name: Required checks
    if: always()
    needs: [secrets, verify, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          SECRETS_RESULT: ${{ needs.secrets.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
        run: |
          test "$SECRETS_RESULT" = success
          test "$VERIFY_RESULT" = success
          test "$CONTAINERS_RESULT" = success
