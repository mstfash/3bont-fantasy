name: 3bont-fantasy
services:
  proxy:
    image: caddy:2-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?Set the public application hostname}
      APP_UPSTREAM: web:3100
      TLS_ISSUER: acme
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy_data:/data
      - proxy_config:/config
    depends_on:
      web: { condition: service_healthy }
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m,mode=1777']
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: local
      options: { max-size: '10m', max-file: '5' }
  postgres:
    image: ${POSTGRES_IMAGE:?Set the built PostgreSQL 17 pgBackRest image digest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: fantasy
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password, pgbackrest_config]
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60
      - -c
      - archive_command=pgbackrest --stanza=fantasy archive-push %p
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fantasy -d fantasy']
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 2g
    cpus: 1.5
    logging: &bounded_logs
      driver: local
      options:
        max-size: '10m'
        max-file: '5'
  web:
    image: ${WEB_IMAGE:?Set the built web release image digest}
    init: true
    restart: unless-stopped
    env_file: ['${SECRETS_DIR:?Set an absolute private directory}/web.env']
    environment:
      APP_ENV: production
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3100'
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/api/health',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 3
    logging: *bounded_logs
  worker:
    image: ${WORKER_IMAGE:?Set the built worker release image digest}
    init: true
    restart: unless-stopped
    env_file: ['${SECRETS_DIR}/worker.env']
    environment:
      APP_ENV: production
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 60s
    logging: *bounded_logs
  migrate:
    image: ${WORKER_IMAGE:?Set the built worker release image digest}
    profiles: [operations]
    command: ['node', 'dist/migrate.js']
    env_file: ['${SECRETS_DIR}/web.env']
    environment:
      APP_ENV: production
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    logging: *bounded_logs
secrets:
  pgbackrest_config:
    file: ${SECRETS_DIR}/pgbackrest.conf
  database_password:
    file: ${SECRETS_DIR}/database-password
volumes:
  proxy_data:
  proxy_config:
  database:
