name: 3bont-fantasy
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set a reviewed PostgreSQL 17 image digest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: fantasy
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fantasy -d fantasy']
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 2g
    cpus: 1.5
    logging: &bounded_logs
      driver: local
      options:
        max-size: '10m'
        max-file: '5'
  web:
    image: ${WEB_IMAGE:?Set the built web release image digest}
    init: true
    restart: unless-stopped
    env_file: ['${SECRETS_DIR:?Set an absolute private directory}/web.env']
    environment:
      APP_ENV: production
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3100'
    ports: ['127.0.0.1:${WEB_PORT:-3100}:3100']
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/api/health',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 3
    logging: *bounded_logs
  worker:
    image: ${WORKER_IMAGE:?Set the built worker release image digest}
    init: true
    restart: unless-stopped
    env_file: ['${SECRETS_DIR}/worker.env']
    environment:
      APP_ENV: production
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 60s
    logging: *bounded_logs
  migrate:
    image: ${WORKER_IMAGE:?Set the built worker release image digest}
    profiles: [operations]
    command: ['node', 'dist/migrate.js']
    env_file: ['${SECRETS_DIR}/web.env']
    environment:
      APP_ENV: production
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    logging: *bounded_logs
secrets:
  database_password:
    file: ${SECRETS_DIR}/database-password
volumes:
  database:
